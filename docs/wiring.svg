<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470">
  <rect width="1000" height="470" fill="#ffffff"/>
  <style>
    text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
    .t{font-size:13px;fill:#111}
    .b{font-size:15px;font-weight:600;fill:#111}
    .s{font-size:11px;fill:#555}
    .box{fill:#f4f4f4;stroke:#111;stroke-width:1.5}
    .r{fill:#ededed;stroke:#111;stroke-width:1.5}
    .w{fill:none;stroke-width:2.5}
  </style>

  <text class="b" x="24" y="28">Pico 2 to the controller cable</text>
  <text class="s" x="24" y="46">Colours follow the wire table. Keep D+ and D&#8722; twisted as far as the resistors. The shield stays disconnected.</text>

  <rect class="box" x="70" y="70" width="130" height="350" rx="6"/>
  <text class="t" x="194" y="134" text-anchor="end">GP0 pin 1</text>
  <text class="t" x="194" y="169" text-anchor="end">GP1 pin 2</text>
  <text class="t" x="194" y="204" text-anchor="end">GND pin 3</text>
  <text class="t" x="194" y="239" text-anchor="end">GP2 pin 4</text>
  <text class="t" x="194" y="354" text-anchor="end">GND pin 38</text>
  <text class="t" x="194" y="389" text-anchor="end">VBUS pin 40</text>
  <text class="s" x="135" y="100" text-anchor="middle">Raspberry Pi</text>
  <text class="s" x="135" y="116" text-anchor="middle">Pico 2</text>

  <rect class="r" x="240" y="118" width="60" height="24" rx="3"/>
  <text class="s" x="270" y="134" text-anchor="middle">22 &#937;</text>
  <rect class="r" x="240" y="153" width="60" height="24" rx="3"/>
  <text class="s" x="270" y="169" text-anchor="middle">22 &#937;</text>
  <rect class="r" x="240" y="223" width="60" height="24" rx="3"/>
  <text class="s" x="270" y="239" text-anchor="middle">6.8 k&#937;</text>

  <line class="w" x1="200" y1="130" x2="240" y2="130" stroke="#1a9e4b"/>
  <line class="w" x1="300" y1="130" x2="700" y2="130" stroke="#1a9e4b"/>
  <text class="s" x="470" y="122" text-anchor="middle">D+ green</text>

  <line class="w" x1="200" y1="165" x2="240" y2="165" stroke="#8a8a8a"/>
  <line class="w" x1="300" y1="165" x2="700" y2="165" stroke="#8a8a8a"/>
  <text class="s" x="470" y="157" text-anchor="middle">D&#8722; white</text>

  <line class="w" x1="200" y1="235" x2="240" y2="235" stroke="#111"/>
  <line class="w" x1="300" y1="235" x2="356" y2="235" stroke="#111"/>
  <polygon points="356,223 356,247 380,235" fill="#ededed" stroke="#111" stroke-width="1.5"/>
  <line x1="380" y1="223" x2="380" y2="247" stroke="#111" stroke-width="1.5"/>
  <text class="s" x="368" y="214" text-anchor="middle">3 mm LED</text>
  <line class="w" x1="380" y1="235" x2="380" y2="200" stroke="#111"/>
  <line class="w" x1="380" y1="200" x2="200" y2="200" stroke="#111"/>
  <text class="s" x="290" y="194" text-anchor="middle">cathode to GND pin 3</text>

  <line class="w" x1="200" y1="350" x2="700" y2="350" stroke="#111"/>
  <text class="s" x="470" y="342" text-anchor="middle">GND black</text>

  <line class="w" x1="200" y1="385" x2="700" y2="385" stroke="#d22626"/>
  <text class="s" x="470" y="377" text-anchor="middle">VBUS red</text>

  <text class="s" x="300" y="440">Pins 3 and 38 are both ground. The LED uses pin 3, the cable uses pin 38.</text>

  <rect class="box" x="700" y="100" width="130" height="320" rx="6"/>
  <text class="t" x="706" y="134">D+</text>
  <text class="t" x="706" y="169">D&#8722;</text>
  <text class="t" x="706" y="354">GND</text>
  <text class="t" x="706" y="389">VBUS</text>
  <text class="s" x="765" y="62" text-anchor="middle">to the controller</text>
  <text class="s" x="765" y="80" text-anchor="middle">USB-B plug</text>
</svg>
